name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Check if tag matches __version__
        run: |
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION_FROM_FILE=$(grep -Po '(?<=__version__ = ")[^"]*' src/azure_functions_knowledge/__init__.py)
          TAG_VERSION=${TAG_NAME#v}
          echo "Version from file: $VERSION_FROM_FILE"
          echo "Tag name: $TAG_NAME"
          echo "Version from tag: $TAG_VERSION"
          if [ "$VERSION_FROM_FILE" != "$TAG_VERSION" ]; then
            echo "::error ::Version in __init__.py ($VERSION_FROM_FILE) does not match git tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build distribution packages
        run: python -m build

      - name: Verify built wheel is non-empty and importable
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          echo "Inspecting $WHEEL"
          MODCOUNT=$(python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(len([n for n in z.namelist() if n.endswith('.py')]))" "$WHEEL")
          echo "Wheel contains $MODCOUNT .py modules"
          if [ "$MODCOUNT" -eq 0 ]; then
            echo "::error ::Built wheel is EMPTY (0 .py modules) — refusing to publish"
            exit 1
          fi
          python -m venv /tmp/verify-wheel
          /tmp/verify-wheel/bin/pip install --upgrade pip
          /tmp/verify-wheel/bin/pip install "$WHEEL"
          /tmp/verify-wheel/bin/python -c "import azure_functions_knowledge; print('import OK', azure_functions_knowledge.__version__)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
