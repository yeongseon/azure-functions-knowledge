site_name: azure-functions-knowledge-python
site_url: https://yeongseon.github.io/azure-functions-knowledge-python/
site_description: Knowledge retrieval (RAG) decorators for Azure Functions Python v2
repo_url: https://github.com/yeongseon/azure-functions-knowledge-python
repo_name: yeongseon/azure-functions-knowledge-python

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - content.code.copy
    - navigation.sections

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js
